services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./tests/postgres-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "sh -c \"ps -o pid,comm | grep -Eq '^ *1 postgres' && pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Development container with your app
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9090:9090" # Prometheus metrics
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: s3admin
      S3_SECRET_ACCESS_KEY: s3secret
      S3_REGION: us-east-1
      S3_BUCKET: test-bucket
      S3_PATH_PREFIX: backups
      S3_SSL: "false"
      CRON_SCHEDULE: "* * * * *" # every minute
      DUMP_INFIX: "_dev"
      LOG_LEVEL: "debug"
      TIME_ZONE: "Europe/Berlin"
      # RESTORE_KEY: "backups/pg16_postgres_2025-08-08T21-41-00_dev.sql.gz"
    volumes:
      - .:/app
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: air 

  # Local S3 for testing
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3secret
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

  create-bucket:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      curl -fsS -X PUT --user s3admin:s3secret
      --aws-sigv4 aws:amz:us-east-1:s3
      http://seaweedfs:8333/test-bucket
